name: ledgerx

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ledgerx
      POSTGRES_PASSWORD: ledgerx
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - ledgerx-postgres:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledgerx"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - ledgerx-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:3.9.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: ledgerx-demo-cluster
    volumes:
      - ledgerx-kafka:/tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    ports:
      - "8088:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: ledgerx
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy

  identity-api:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        PROJECT: src/Identity/LedgerX.Identity.Api/LedgerX.Identity.Api.csproj
    command: ["dotnet", "LedgerX.Identity.Api.dll"]
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__identity: Host=postgres;Port=5432;Database=ledgerx_identity;Username=ledgerx;Password=ledgerx
      Kafka__BootstrapServers: kafka:9092
      LEDGERX_DEMO_PASSWORD: ${LEDGERX_DEMO_PASSWORD:-LedgerX-Demo-2026!}
    ports: ["5101:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }

  accounts-api:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        PROJECT: src/Accounts/LedgerX.Accounts.Api/LedgerX.Accounts.Api.csproj
    command: ["dotnet", "LedgerX.Accounts.Api.dll"]
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__accounts: Host=postgres;Port=5432;Database=ledgerx_accounts;Username=ledgerx;Password=ledgerx
      Kafka__BootstrapServers: kafka:9092
    ports: ["5102:8080"]
    depends_on:
      postgres: { condition: service_healthy }

  ledger-api:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        PROJECT: src/Ledger/LedgerX.Ledger.Api/LedgerX.Ledger.Api.csproj
    command: ["dotnet", "LedgerX.Ledger.Api.dll"]
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__ledger: Host=postgres;Port=5432;Database=ledgerx_ledger;Username=ledgerx;Password=ledgerx
      Kafka__BootstrapServers: kafka:9092
    ports: ["5104:8080"]
    depends_on:
      postgres: { condition: service_healthy }

  payments-api:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        PROJECT: src/Payments/LedgerX.Payments.Api/LedgerX.Payments.Api.csproj
    command: ["dotnet", "LedgerX.Payments.Api.dll"]
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__payments: Host=postgres;Port=5432;Database=ledgerx_payments;Username=ledgerx;Password=ledgerx
      ConnectionStrings__redis: redis:6379
      Services__Accounts: http://accounts-api:8080
      Services__Ledger: http://ledger-api:8080
      Kafka__BootstrapServers: kafka:9092
    ports: ["5103:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      accounts-api: { condition: service_started }
      ledger-api: { condition: service_started }

  audit-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        PROJECT: src/Workers/LedgerX.Audit.Worker/LedgerX.Audit.Worker.csproj
    command: ["dotnet", "LedgerX.Audit.Worker.dll"]
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__audit: Host=postgres;Port=5432;Database=ledgerx_audit;Username=ledgerx;Password=ledgerx
      Kafka__BootstrapServers: kafka:9092
    ports: ["5105:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }

  notification-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        PROJECT: src/Workers/LedgerX.Notification.Worker/LedgerX.Notification.Worker.csproj
    command: ["dotnet", "LedgerX.Notification.Worker.dll"]
    environment:
      Kafka__BootstrapServers: kafka:9092
    ports: ["5106:8080"]
    depends_on:
      kafka: { condition: service_healthy }

  projection-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        PROJECT: src/Workers/LedgerX.Projection.Worker/LedgerX.Projection.Worker.csproj
    command: ["dotnet", "LedgerX.Projection.Worker.dll"]
    environment:
      ConnectionStrings__redis: redis:6379
      Services__Accounts: http://accounts-api:8080
      Services__Ledger: http://ledger-api:8080
      Kafka__BootstrapServers: kafka:9092
    ports: ["5107:8080"]
    depends_on:
      kafka: { condition: service_healthy }
      redis: { condition: service_healthy }

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        PROJECT: src/Web/LedgerX.Web/LedgerX.Web.csproj
    command: ["dotnet", "LedgerX.Web.dll"]
    environment:
      Services__Identity: http://identity-api:8080
      Services__Accounts: http://accounts-api:8080
      Services__Payments: http://payments-api:8080
      Services__Ledger: http://ledger-api:8080
      Services__Audit: http://audit-worker:8080
    ports: ["5100:8080"]
    depends_on:
      - identity-api
      - accounts-api
      - payments-api
      - ledger-api

volumes:
  ledgerx-postgres:
  ledgerx-redis:
  ledgerx-kafka:
